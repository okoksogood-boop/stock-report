const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open1(key,x){
 const iv=b64(x.iv),ct=b64(x.ct),all=new Uint8Array(iv.length+ct.length);all.set(iv);all.set(ct,iv.length);
 const hk=await crypto.subtle.importKey('raw',key.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 if(!await crypto.subtle.verify('HMAC',hk,b64(x.mac),all))return null;
 const ak=await crypto.subtle.importKey('raw',key.slice(0,32),'AES-CBC',false,['decrypt']);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ak,ct));
}
async function dec(pw){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},k,512));
 for(const x of D.k){const ck=await open1(bits,x);if(ck){const h=await open1(ck,D);if(h)return new TextDecoder().decode(h);}}
 throw new Error('bad');
}
function ask(msg){document.getElementById('w').style.display='none';document.getElementById('ask').style.display='block';document.getElementById('m').textContent=msg||'';}
async function go(pw,auto){
 try{const h=await dec(pw);
  try{if(auto||document.getElementById('r').checked)localStorage.setItem('twrp',pw);}catch(e){}
  document.open();document.write(h);document.close();
 }catch(e){ if(auto){try{localStorage.removeItem('twrp');}catch(x){} ask('密碼已更換,請重新輸入');} else ask('密碼錯誤,請再試一次'); }
}
document.getElementById('b').onclick=()=>go(document.getElementById('p').value,false);
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')go(e.target.value,false);});
let sp=null;try{sp=localStorage.getItem('twrp');}catch(e){}
if(!window.crypto||!crypto.subtle)ask('這個瀏覽器不支援解密,請用 Chrome 開啟');else if(sp)go(sp,true);else ask('');
